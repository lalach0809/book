<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>구글 시트 연동 도서 계층 및 노션 슬라이드 뷰어</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      touch-action: manipulation;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    .notion-h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #6d28d9;
      line-height: 1.35;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      padding-bottom: 0.3rem;
      border-bottom: 1.5px solid #ede9fe;
    }
    .notion-h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1d4ed8;
      line-height: 1.4;
      margin-top: 0.9rem;
      margin-bottom: 0.4rem;
    }
    .notion-h3 {
      font-size: 1.02rem;
      font-weight: 600;
      color: #0f766e;
      line-height: 1.45;
      margin-top: 0.8rem;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .notion-h3::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 12px;
      background-color: #0d9488;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .notion-callout {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #10b981;
      border-radius: 8px;
      padding: 8px 12px;
      margin: 8px 0;
    }
    .notion-quote {
      border-left: 3px solid #64748b;
      padding-left: 10px;
      color: #334155;
      font-style: italic;
      margin: 6px 0;
    }
    .notion-code {
      background-color: #1e293b;
      color: #e2e8f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82em;
      line-height: 1.5;
      overflow-x: auto;
      margin: 6px 0;
    }
    .notion-inline-code {
      background-color: #f1f5f9;
      color: #e11d48;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      padding: 1px 3px;
      border-radius: 4px;
      font-size: 0.84em;
      font-weight: 600;
    }
    .notion-hr {
      border: 0;
      height: 1px;
      background-color: #e2e8f0;
      margin: 0.75rem 0;
    }
    .notion-highlight {
      background-color: #fef08a;
      padding: 0 2px;
      border-radius: 3px;
    }

/* 모바일 및 지폴드 5 최적화: 2배 크기에서 25% 축소 (원본 대비 1.5배) */
  @media (max-width: 1024px) {
    /* 슬라이드 본문 기본 텍스트 (기존 1.5rem -> 1.125rem) */
    #slideContent {
      font-size: 1.15rem !important;
      line-height: 1.75 !important;
    }

    /* 노션 스타일 소제목 및 블록 */
    #slideContent .notion-h1 {
      font-size: 2.0rem !important;
      line-height: 1.35 !important;
    }
    #slideContent .notion-h2 {
      font-size: 1.7rem !important;
      line-height: 1.4 !important;
    }
    #slideContent .notion-h3 {
      font-size: 1.5rem !important;
      line-height: 1.45 !important;
    }
    #slideContent .notion-callout,
    #slideContent .notion-quote {
      font-size: 1.15rem !important;
      line-height: 1.65 !important;
    }
    #slideContent .notion-code {
      font-size: 1.0rem !important;
    }
    #slideContent .notion-inline-code {
      font-size: 1.05rem !important;
    }

    /* 슬라이드 개별 제목 */
    #slideTitle {
      font-size: 1.35rem !important;
      line-height: 1.4 !important;
    }

    /* 상단 목차 타이틀 */
    #currentHeadingTitle {
      font-size: 1.35rem !important;
    }
  }
</style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden select-none md:select-auto">

  <!-- 2열 분리 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 px-3 py-2 flex flex-col gap-2 shadow-xs z-30 flex-shrink-0">
    
    <!-- 1열: 분류체계 선택 + 워크시트(도서) 선택 -->
    <div class="flex items-center gap-1.5 w-full">
      <button onclick="toggleMobileSidebar()" class="lg:hidden p-1.5 text-slate-600 hover:bg-slate-100 rounded-lg transition flex-shrink-0" title="목차 열기">
        <i class="fa-solid fa-bars text-base"></i>
      </button>

      <div class="bg-emerald-600 text-white w-7 h-7 sm:w-8 sm:h-8 rounded-lg flex items-center justify-center shadow-xs flex-shrink-0">
        <i class="fa-solid fa-book-open-reader text-xs sm:text-sm"></i>
      </div>

      <!-- 1단계: 도서 분류체계 (기본 빈 선택지) -->
      <div class="relative w-36 sm:w-40 md:w-44 flex-shrink-0">
        <select id="genreSelectDropdown" onchange="onGenreChange(this.value)" class="w-full bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 font-bold text-xs text-indigo-900 rounded-lg px-2 py-1.5 pr-4 focus:outline-none focus:ring-1 focus:ring-indigo-400 cursor-pointer truncate shadow-xs">
          <option value="">📁 분야 선택</option>
        </select>
      </div>

      <!-- 2단계: 도서 선택 (초기 비활성화) -->
      <div class="relative flex-1 min-w-0">
        <select id="bookSelectDropdown" onchange="onBookChange(this.value)" disabled class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-300 font-bold text-xs sm:text-sm text-slate-900 rounded-lg px-2.5 py-1.5 pr-6 focus:outline-none focus:ring-1 focus:ring-emerald-500 cursor-pointer truncate shadow-xs disabled:opacity-60 disabled:cursor-not-allowed">
          <option value="">먼저 분야를 선택해주세요</option>
        </select>
      </div>

      <!-- 동기화 상태 배지 -->
      <span id="syncStatusBadge" class="hidden sm:inline-block text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-semibold flex-shrink-0">
        대기
      </span>
    </div>

    <!-- 2열: 저자/완독 현황 및 기능 버튼들 -->
    <div class="flex items-center justify-between gap-1.5 w-full">
      
      <!-- 도서 저자 및 완독률 -->
      <div class="flex items-center gap-1.5 text-[11px] text-slate-500 font-medium min-w-0 flex-1 truncate pr-1">
        <span id="bookAuthorDisplay" class="truncate max-w-[100px] sm:max-w-[150px]">
          <i class="fa-solid fa-user-pen mr-0.5 text-slate-400"></i>저자
        </span>
        <span class="text-slate-300">•</span>
        <span id="readingProgressDisplay" class="text-emerald-700 font-bold bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200 truncate">
          <i class="fa-solid fa-circle-check mr-0.5 text-emerald-600"></i>0% 완독
        </span>
      </div>

      <!-- 기능 버튼 그룹 -->
      <div class="flex items-center gap-1 flex-shrink-0">
        <button onclick="handleUserAuthClick()" id="btnUserLoginToggle" class="px-2 py-1 text-[11px] font-bold rounded-lg border transition flex items-center gap-1 bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100 shadow-xs" title="회원 로그인/로그아웃">
          <i class="fa-solid fa-user text-[10px]"></i>
          <span id="userLoginText">로그인</span>
        </button>

        <button onclick="goToBookmark()" id="btnGoBookmark" class="px-2 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 text-[11px] font-bold rounded-lg transition flex items-center gap-1 shadow-xs" title="책갈피 이동">
          <i class="fa-solid fa-bookmark text-amber-600 text-xs"></i>
          <span class="hidden sm:inline">책갈피</span>
        </button>

        <button onclick="resetBookProgress()" id="btnResetProgress" class="p-1.5 sm:px-2 sm:py-1 bg-slate-50 hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-200 hover:border-rose-200 text-[11px] font-semibold rounded-lg transition flex items-center gap-1" title="완독 기록 초기화">
          <i class="fa-solid fa-rotate-left text-xs"></i>
          <span class="hidden md:inline">초기화</span>
        </button>

        <button onclick="reloadCurrentBookData()" class="p-1.5 sm:px-2 sm:py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-semibold rounded-lg transition" title="새로고침 (캐시 갱신)">
          <i class="fa-solid fa-arrows-rotate text-xs" id="refreshIcon"></i>
        </button>

        <button onclick="openAddDataModal()" id="btnHeaderAddSlide" class="hidden px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold rounded-lg shadow-xs transition items-center gap-1" title="새 슬라이드 등록">
          <i class="fa-solid fa-plus text-xs"></i>
          <span class="hidden sm:inline">등록</span>
        </button>

        <button onclick="toggleAdminAuth()" id="btnAdminToggle" class="p-1.5 sm:px-2 sm:py-1 text-[11px] font-semibold rounded-lg border transition flex items-center gap-1 bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200" title="관리자 로그인">
          <i id="adminLockIcon" class="fa-solid fa-lock text-[10px]"></i>
          <span id="adminToggleText" class="hidden sm:inline">관리자</span>
        </button>

        <button onclick="openApiSettingModal()" class="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition" title="설정">
          <i class="fa-solid fa-gear text-xs"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- 진행률 바 -->
  <div class="w-full bg-slate-200 h-1 flex-shrink-0">
    <div id="readingProgressBar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
  </div>

  <!-- 메인 레이아웃 -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <div id="mobileBackdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden lg:hidden transition-opacity"></div>

    <!-- 좌측 목차 트리 사이드바 -->
    <aside id="mainSidebar" class="fixed lg:static inset-y-0 left-0 w-[85vw] sm:w-[420px] md:w-[480px] lg:w-[500px] bg-white border-r border-slate-200 flex flex-col z-50 lg:z-10 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex-shrink-0">
      <div class="p-3 border-b border-slate-200 bg-slate-50 space-y-2 flex-shrink-0">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5 text-xs sm:text-sm font-bold text-slate-800">
            <i class="fa-solid fa-folder-tree text-emerald-600"></i>
            <span>도서 목차 구조</span>
          </div>
          <div class="flex items-center gap-1 text-[11px]">
            <button onclick="toggleAllNodes(false)" class="px-2 py-0.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 rounded font-medium">펼치기</button>
            <button onclick="toggleAllNodes(true)" class="px-2 py-0.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 rounded font-medium">접기</button>
            <button onclick="toggleMobileSidebar()" class="lg:hidden p-1 text-slate-400 hover:text-slate-700 ml-0.5">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>
          </div>
        </div>

        <div class="relative">
          <input type="text" id="treeSearchInput" oninput="filterTreeSearch(this.value)" placeholder="목차 검색..." class="w-full bg-white border border-slate-200 rounded-lg pl-7 pr-3 py-1.5 text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-[11px] text-slate-400"></i>
        </div>
      </div>

      <div id="treeContainer" class="flex-1 overflow-y-auto p-2.5 space-y-1 custom-scrollbar"></div>

      <div class="p-2.5 bg-slate-50 border-t border-slate-200 text-[11px] text-slate-600 flex flex-wrap items-center justify-between gap-1 flex-shrink-0 font-medium">
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-purple-600 inline-block"></span>편</span>
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-600 inline-block"></span>장</span>
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-teal-600 inline-block"></span>절</span>
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-600 inline-block"></span>관</span>
        <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-indigo-600 inline-block"></span>서문</span>
      </div>
    </aside>

    <!-- 우측 슬라이드 뷰어 영역 -->
    <main class="flex-1 flex flex-col bg-slate-100 overflow-hidden relative min-w-0">
      
      <div class="bg-white border-b border-slate-200 px-3 md:px-6 py-1.5 flex items-center justify-between flex-shrink-0">
        <div id="breadcrumbContainer" class="flex items-center gap-1 text-[11px] sm:text-xs text-slate-500 font-medium overflow-x-auto whitespace-nowrap pr-2">
          <span>도서 분야를 선택해주세요.</span>
        </div>
        
        <div class="flex items-center gap-1 flex-shrink-0">
          <span id="nodeTypeBadge" class="text-[9px] sm:text-[10px] px-1.5 py-0.2 font-bold rounded-full border">
            구조
          </span>
        </div>
      </div>

      <div id="slideTouchArea" class="flex-1 flex flex-col p-2 sm:p-4 md:p-6 overflow-hidden">
        
        <div class="flex items-center justify-between mb-1.5 sm:mb-3 flex-shrink-0">
          <div class="flex items-center gap-1.5 min-w-0 mr-1.5">
            <span id="headerTypeIcon" class="w-6 h-6 sm:w-7 sm:h-7 md:w-8 md:h-8 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 bg-slate-100 text-slate-500">
              <i class="fa-solid fa-bookmark"></i>
            </span>
            <h2 id="currentHeadingTitle" class="text-sm sm:text-base md:text-lg font-bold truncate text-slate-700">
              항목 제목
            </h2>

            <button onclick="toggleCurrentBookmark()" id="btnBookmarkToggle" class="p-1 text-slate-300 hover:text-amber-500 rounded transition flex-shrink-0" title="책갈피">
              <i id="bookmarkIcon" class="fa-regular fa-bookmark text-sm sm:text-base"></i>
            </button>
          </div>

          <div class="flex items-center gap-1 sm:gap-1.5 flex-shrink-0">
            <div id="editActionGroup" class="hidden items-center gap-1">
              <button onclick="enableInlineEdit()" id="btnStartEdit" class="px-2 py-0.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded text-[11px] font-bold transition flex items-center gap-1">
                <i class="fa-solid fa-pen text-[10px]"></i>
                <span class="hidden sm:inline">수정</span>
              </button>
              <button onclick="saveInlineEdit()" id="btnSaveEdit" class="hidden px-2 py-0.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-bold transition items-center gap-1">
                <i class="fa-solid fa-floppy-disk text-[10px]"></i>
                <span>저장</span>
              </button>
              <button onclick="cancelInlineEdit()" id="btnCancelEdit" class="hidden px-1.5 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-[11px] font-bold transition items-center">
                <i class="fa-solid fa-xmark text-[10px]"></i>
              </button>
            </div>

            <div class="flex items-center bg-white border border-slate-200 rounded-lg p-0.5 shadow-xs">
              <button onclick="toggleTTS()" id="btnTTSPlay" class="px-2 py-0.5 text-[11px] font-semibold text-slate-600 hover:text-emerald-700 rounded flex items-center gap-1 transition" title="음성 낭독">
                <i id="ttsPlayIcon" class="fa-solid fa-volume-high text-emerald-600 text-xs"></i>
                <span id="ttsStatusText" class="hidden sm:inline text-[10px]">읽기</span>
              </button>
              <button onclick="stopTTS()" id="btnTTSStop" class="p-1 text-slate-400 hover:text-rose-600 rounded transition" title="정지">
                <i class="fa-solid fa-stop text-xs"></i>
              </button>
            </div>

            <div class="bg-white border border-slate-200 px-2 py-0.5 rounded-lg text-[11px] font-semibold text-slate-700 shadow-xs flex items-center gap-1">
              <i class="fa-regular fa-clone text-emerald-600 text-[10px]"></i>
              <span><span id="currentSlideNum" class="text-emerald-600 font-bold">0</span>/<span id="totalSlideNum">0</span></span>
            </div>

            <button onclick="deleteCurrentSlide()" id="btnDeleteSlide" class="hidden px-2 py-0.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded text-[11px] font-bold transition items-center gap-1" title="삭제">
              <i class="fa-solid fa-trash-can text-[10px]"></i>
              <span class="hidden sm:inline">삭제</span>
            </button>
          </div>
        </div>

        <!-- 슬라이드 본문 카드 -->
        <div class="flex-1 flex items-center gap-1.5 sm:gap-3 md:gap-4 min-h-0 relative">
          <button id="prevBtn" onclick="navigateSlide(-1)" class="hidden lg:flex w-10 h-16 bg-white hover:bg-slate-800 text-slate-400 hover:text-white rounded-xl shadow-xs border border-slate-200 items-center justify-center transition disabled:opacity-30 disabled:pointer-events-none group flex-shrink-0" disabled>
            <i class="fa-solid fa-chevron-left text-lg group-hover:-translate-x-0.5 transition-transform"></i>
          </button>

          <div class="flex-1 h-full bg-white rounded-xl md:rounded-2xl shadow-xs md:shadow-md border border-slate-200/80 p-3.5 sm:p-5 md:p-7 flex flex-col justify-between overflow-hidden relative">
            <div id="slideHeaderContainer" class="flex-shrink-0 border-b border-slate-100 pb-1.5 mb-1.5 hidden">
              <div class="flex items-center gap-1.5 mb-0.5">
                <span id="slideTagBadge" class="text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.2 rounded border">
                  #1
                </span>
                <p id="slideSubtitle" class="text-[10px] sm:text-[11px] font-semibold truncate text-slate-400"></p>
              </div>
              <h3 id="slideTitle" class="text-sm sm:text-base md:text-lg font-bold leading-snug line-clamp-2 md:line-clamp-none"></h3>
            </div>

            <div id="slideContent" class="flex-1 overflow-y-auto custom-scrollbar text-xs sm:text-sm md:text-base text-slate-800 leading-relaxed pr-1 pb-4 font-normal">
              <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs sm:text-sm p-8 text-center">
                <i class="fa-solid fa-layer-group text-3xl text-indigo-300 mb-3"></i>
                <p class="font-bold text-slate-600 mb-1">도서 분류 체계를 선택해주세요</p>
                <p class="text-xs text-slate-400">상단 왼쪽 드롭다운에서 읽고자 하는 분야를 선택하면 도서 목록이 표시됩니다.</p>
              </div>
            </div>

            <div id="slideEditContainer" class="flex-1 hidden flex-col pb-2 min-h-0">
              <div class="flex items-center justify-between text-[10px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded mb-1.5 border border-emerald-100 font-medium">
                <span><i class="fa-solid fa-pencil mr-1"></i>슬라이드 내용 수정 중 (시트에 즉시 반영됩니다)</span>
              </div>
              <textarea id="slideEditTextArea" class="flex-1 w-full p-2.5 border border-emerald-300 focus:border-emerald-500 rounded-lg text-xs sm:text-sm text-slate-800 leading-relaxed font-mono resize-none focus:outline-none focus:ring-2 focus:ring-emerald-200 custom-scrollbar shadow-inner" placeholder="내용을 입력하세요."></textarea>
            </div>

            <div class="flex-shrink-0 pt-2 mt-1 border-t border-slate-100 flex items-center justify-between">
              <button id="mobilePrevBtn" onclick="navigateSlide(-1)" class="lg:hidden px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-[11px] font-bold disabled:opacity-30 transition flex items-center gap-1" disabled>
                <i class="fa-solid fa-chevron-left text-[9px]"></i> 이전
              </button>

              <div id="dotsContainer" class="flex items-center gap-1 overflow-x-auto max-w-[50%] md:max-w-[60%] py-0.5"></div>

              <button id="mobileNextBtn" onclick="navigateSlide(1)" class="lg:hidden px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[11px] font-bold disabled:opacity-30 transition flex items-center gap-1" disabled>
                다음 <i class="fa-solid fa-chevron-right text-[9px]"></i>
              </button>

  <script>
    const GENRE_API_URLS = {
      "종교": "https://script.google.com/macros/s/AKfycby6DvIBMHbr_XARJa-vMX9vRdiyAs1WmVmQRQUFlT60544_dL4ZeuHcViP9JJDrLOR5/exec",
      "기술과학": "https://script.google.com/macros/s/AKfycbxwFuAKviYQoUNm_HgFoZbkiuB1d2MZTtRq3FBj7FJFEyB426dA-dR9J2yIWT6XHsI/exec",
      "사회과학": "https://script.google.com/macros/s/AKfycbzbAIgt2fsG_FgxoNt3_044LtJLtlQFK9PvAD9cGMufsTnlzoAqGSI7yoJRoHJCMRa9/exec",
      "언어": "https://script.google.com/macros/s/AKfycbziAs5sq1FeF1e_pIYnBGrSYELzm0XtCtVM21vhzAvnizWY9hRDNf_9dQF6QAO1cauM/exec",
      "역사": "https://script.google.com/macros/s/AKfycbyX7_mpsohU2a3b0vBCSuw1FGeYf_m4lO8n19MUF3G4hsrZqgseA55ACFSY5IElzKAS/exec",
      "예술": "https://script.google.com/macros/s/AKfycbw1x_yyt6P930s_s8_wZ6LOT1Ar26mRbd1MBH4Nlvdq4IkX1DUSxoTis8cXLXxIUr7_/exec",
      "외국문학": "https://script.google.com/macros/s/AKfycbxgMI4JHJohqw31ChkgptG089UxMYKBxu2IxPpdc7paI1U6SrTavtZgAoTdHDdPWNfAUg/exec",
      "자연과학": "https://script.google.com/macros/s/AKfycbz6BFENjVDHUwH0dXwcHZCJg0xnyw4s4z-QoqO3h3yayyLphZ1FbC6ErOv8wSv0L74B/exec",
      "철학": "https://script.google.com/macros/s/AKfycbyX014Cgsr8LHDD9AqP2FvZQGm5ERXWbBsk_KaOT9h8PkW6b7RopP5-6hVH1no9jN96SA/exec",
      "총류": "https://script.google.com/macros/s/AKfycbwO11RFCWfvlxlzZLu10vZ3FdpEHWIEOug5If1vPqli-IqdKt1ATGezq4MT19xPn6cC/exec",
      "한국문학": "https://script.google.com/macros/s/AKfycbw9p1OmipoctyP1tZJ4dOuDJUCFzyVgljfrE2z9Zw5m7l0oXjo-TkenJqiF78FOjihD/exec"
    };

    const BOOK_GENRES = [
      "종교", "철학", "사회과학", "자연과학", "기술과학", 
      "예술", "언어", "한국문학", "외국문학", "역사", "총류"
    ];

    let selectedGenre = "";
    let CURRENT_USER_ID = localStorage.getItem("BOOK_CURRENT_USER_ID") || null;
    let ADMIN_PASSWORD = localStorage.getItem("BOOK_ADMIN_PW") || "1234";
    let isAdminLoggedIn = false;

    let availableBookTitles = [];
    let currentBookData = {
      title: "",
      author: "",
      rows: [],
      tree: null
    };

    let cloudBookmarks = {};
    let cloudReadingProgress = {};
    let selectedLeafNode = null;
    let currentSlideIdx = 0;

    let isInlineEditing = false;
    let ttsUtterance = null;
    let isTTSPlaying = false;
    let isTTSPaused = false;

    function getActiveApiUrl() {
      return GENRE_API_URLS[selectedGenre] || GENRE_API_URLS["종교"];
    }

    // 1단계: 도서 분류체계(11대 분야) 초기화
    function initGenreDropdown() {
      const dropdown = document.getElementById("genreSelectDropdown");
      if (!dropdown) return;
      dropdown.innerHTML = `<option value="">📁 분야 선택</option>`;

      BOOK_GENRES.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = `📁 ${g}`;
        dropdown.appendChild(opt);
      });

      resetViewerToInitialState();
    }

    function resetViewerToInitialState() {
      const bookDropdown = document.getElementById("bookSelectDropdown");
      const sContent = document.getElementById("slideContent");
      const treeCont = document.getElementById("treeContainer");
      const breadcrumb = document.getElementById("breadcrumbContainer");
      const badge = document.getElementById("syncStatusBadge");
      const authorDisplay = document.getElementById("bookAuthorDisplay");

      if (bookDropdown) {
        bookDropdown.disabled = true;
        bookDropdown.innerHTML = `<option value="">먼저 분야를 선택해주세요</option>`;
      }
      if (treeCont) {
        treeCont.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">상단에서 도서 분야를 먼저 선택해주세요.</div>`;
      }
      if (sContent) {
        sContent.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs sm:text-sm p-8 text-center">
            <i class="fa-solid fa-layer-group text-3xl text-indigo-300 mb-3"></i>
            <p class="font-bold text-slate-600 mb-1">도서 분류 체계를 선택해주세요</p>
            <p class="text-xs text-slate-400">상단 왼쪽 드롭다운에서 읽고자 하는 분야를 선택하면 도서 목록이 표시됩니다.</p>
          </div>
        `;
      }
      if (breadcrumb) {
        breadcrumb.innerHTML = `<span>도서 분야를 선택해주세요.</span>`;
      }
      if (badge) {
        badge.textContent = "대기";
        badge.className = "hidden sm:inline-block text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-semibold flex-shrink-0";
      }
      if (authorDisplay) {
        authorDisplay.innerHTML = `<i class="fa-solid fa-user-pen mr-0.5 text-slate-400"></i>저자`;
      }

      const curNum = document.getElementById("currentSlideNum");
      const totNum = document.getElementById("totalSlideNum");
      if (curNum) curNum.textContent = 0;
      if (totNum) totNum.textContent = 0;
      updateOverallProgress();
    }

    function onGenreChange(newGenre) {
      if (!newGenre) {
        selectedGenre = "";
        resetViewerToInitialState();
        return;
      }

      selectedGenre = newGenre;
      localStorage.setItem("BOOK_SELECTED_GENRE", newGenre);

      stopTTS();
      cancelInlineEdit();
      selectedLeafNode = null;
      currentSlideIdx = 0;
      currentBookData = { title: "", author: "", rows: [], tree: null };

      const bookDropdown = document.getElementById("bookSelectDropdown");
      if (bookDropdown) {
        bookDropdown.disabled = false;
        bookDropdown.innerHTML = `<option value="">'${newGenre}' 도서 목록 불러오는 중...</option>`;
      }

      loadBookList();
    }

    // 2단계: 도서 목록 로드 (캐시 우선 0초 렌더링 + 1회 자동 재시도)
    async function loadBookList(retryCount = 0) {
      if (!selectedGenre) return;

      const dropdown = document.getElementById("bookSelectDropdown");
      const badge = document.getElementById("syncStatusBadge");
      const icon = document.getElementById("refreshIcon");
      const apiUrl = getActiveApiUrl();

      const listCacheKey = `CACHE_LIST_${selectedGenre}`;
      const cachedListStr = localStorage.getItem(listCacheKey);
      if (cachedListStr && retryCount === 0) {
        try {
          availableBookTitles = JSON.parse(cachedListStr);
          populateBookDropdown(availableBookTitles, false);
        } catch(e) {
          localStorage.removeItem(listCacheKey);
        }
      }

      if (badge) {
        badge.textContent = retryCount > 0 ? "재연결 중..." : "동기화 중...";
        badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 font-semibold";
      }
      if (icon) icon.classList.add("fa-spin");

      try {
        const params = new URLSearchParams({
          action: 'get_book_list',
          t: Date.now()
        });

        const res = await fetch(`${apiUrl}${apiUrl.includes('?') ? '&' : '?'}${params.toString()}`);
        const rawText = await res.text();
        
        if (rawText.trim().startsWith("<")) {
          throw new Error("Apps Script 웹 앱 배포 권한을 '모든 사용자(Anyone)'로 설정해주세요.");
        }

        const json = JSON.parse(rawText);

        if (json.success && Array.isArray(json.bookTitles) && json.bookTitles.length > 0) {
          availableBookTitles = json.bookTitles;
          localStorage.setItem(listCacheKey, JSON.stringify(availableBookTitles));
          populateBookDropdown(availableBookTitles, true);

          if (badge) {
            badge.textContent = "완료";
            badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-semibold";
          }
        } else {
          if (retryCount < 1) {
            setTimeout(() => loadBookList(retryCount + 1), 800);
            return;
          }
          handleEmptyBooks(`[${selectedGenre}] 분야에 등록된 도서 시트가 없습니다.`);
        }
      } catch (err) {
        console.error("도서 목록 로드 실패:", err);
        if (retryCount < 1) {
          setTimeout(() => loadBookList(retryCount + 1), 1000);
          return;
        }

        if (badge) {
          badge.textContent = "연결 실패";
          badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 font-semibold";
        }
        if (!cachedListStr) {
          handleEmptyBooks(`[${selectedGenre}] 시트에 연결할 수 없습니다.<br><span class='text-xs text-slate-400'>(${escapeHtml(err.message)})</span>`);
        }
      } finally {
        if (icon) icon.classList.remove("fa-spin");
      }
    }

    function populateBookDropdown(titles, isFromServer = false) {
      const dropdown = document.getElementById("bookSelectDropdown");
      if (!dropdown) return;

      dropdown.disabled = false;
      const currentVal = dropdown.value;
      dropdown.innerHTML = "";
      titles.forEach(title => {
        const opt = document.createElement("option");
        opt.value = title;
        opt.textContent = `📚 ${title}`;
        dropdown.appendChild(opt);
      });

      const lastKey = `LAST_BOOK_${selectedGenre}`;
      const savedBook = localStorage.getItem(lastKey);
      const targetBook = (savedBook && titles.includes(savedBook)) ? savedBook : titles[0];

      dropdown.value = currentVal && titles.includes(currentVal) ? currentVal : targetBook;

      if (!isFromServer && targetBook) {
        loadBookData(targetBook, false);
      } else if (isFromServer && (!currentBookData.title || currentBookData.title !== dropdown.value)) {
        loadBookData(dropdown.value, false);
      }
    }

    // 3단계: 도서 데이터 로드 (캐시 우선 0.01초 렌더링)
    async function loadBookData(bookTitle, forceRefresh = false) {
      if (!bookTitle) return;

      const badge = document.getElementById("syncStatusBadge");
      const icon = document.getElementById("refreshIcon");
      const sContent = document.getElementById("slideContent");
      const apiUrl = getActiveApiUrl();

      stopTTS();
      cancelInlineEdit();
      selectedLeafNode = null;
      currentSlideIdx = 0;

      const localKey = `CACHE_DATA_${selectedGenre}_${bookTitle}`;

      // 1. 캐시가 있으면 즉시 화면 표시
      if (!forceRefresh) {
        const cachedBook = localStorage.getItem(localKey);
        if (cachedBook) {
          try {
            const json = JSON.parse(cachedBook);
            applyBookDataToUI(bookTitle, json);
            if (badge) {
              badge.textContent = "완료";
              badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-semibold";
            }
            return;
          } catch(e) {
            localStorage.removeItem(localKey);
          }
        }
      }

      if (badge) {
        badge.textContent = "로드 중...";
        badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 font-semibold";
      }
      if (icon) icon.classList.add("fa-spin");
      if (sContent) {
        sContent.innerHTML = `<div class="h-full flex flex-col items-center justify-center p-8 text-center text-slate-400 text-xs sm:text-sm"><i class="fa-solid fa-spinner fa-spin text-xl text-emerald-600 mb-2"></i>'${escapeHtml(bookTitle)}' 도서를 불러오는 중입니다...</div>`;
      }

      try {
        const params = new URLSearchParams({
          action: 'get_book_data',
          bookTitle: bookTitle,
          t: Date.now()
        });

        const res = await fetch(`${apiUrl}${apiUrl.includes('?') ? '&' : '?'}${params.toString()}`);
        const rawText = await res.text();

        if (rawText.trim().startsWith("<")) {
          throw new Error("서버에서 HTML 에러 페이지를 반환했습니다. 배포 권한 또는 도서명을 확인해주세요.");
        }

        const json = JSON.parse(rawText);

        if (json.success) {
          localStorage.setItem(localKey, JSON.stringify(json));
          applyBookDataToUI(bookTitle, json);
          if (badge) {
            badge.textContent = "완료";
            badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-semibold";
          }
        } else {
          throw new Error(json.error || "도서 데이터를 읽을 수 없습니다.");
        }
      } catch (err) {
        console.error("도서 데이터 로드 에러:", err);
        if (badge) {
          badge.textContent = "로드 실패";
          badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 font-semibold";
        }
        if (sContent) {
          sContent.innerHTML = `<div class="h-full flex flex-col items-center justify-center p-8 text-center text-rose-500 text-xs sm:text-sm leading-relaxed">
            <i class="fa-solid fa-triangle-exclamation text-xl mb-2"></i>
            <strong>도서 데이터를 불러올 수 없습니다.</strong><br>
            <span class="text-slate-500 text-xs mt-1 inline-block">${escapeHtml(err.message)}</span><br>
            <button onclick="loadBookData('${escapeHtml(bookTitle)}', true)" class="mt-3 px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-bold transition">다시 시도</button>
          </div>`;
        }
      } finally {
        if (icon) icon.classList.remove("fa-spin");
      }
    }

    function applyBookDataToUI(bookTitle, json) {
      localStorage.setItem(`LAST_BOOK_${selectedGenre}`, bookTitle);
      currentBookData.title = bookTitle;
      currentBookData.rows = json.data || [];

      const firstRow = currentBookData.rows[0];
      currentBookData.author = (firstRow && firstRow.author) ? firstRow.author : "저자 미상";

      cloudBookmarks = json.bookmarks || {};
      cloudReadingProgress = json.readingProgress || {};

      processCurrentBookTree();
    }

    function onBookChange(newBookTitle) {
      loadBookData(newBookTitle);
    }

    function reloadCurrentBookData() {
      const keys = Object.keys(localStorage);
      keys.forEach(k => {
        if (k.startsWith("CACHE_")) localStorage.removeItem(k);
      });

      const dropdown = document.getElementById("bookSelectDropdown");
      const bTitle = dropdown ? dropdown.value : currentBookData.title;
      if (bTitle) {
        loadBookData(bTitle, true);
      } else if (selectedGenre) {
        loadBookList();
      }
    }

    function handleEmptyBooks(msg) {
      const dropdown = document.getElementById("bookSelectDropdown");
      const sContent = document.getElementById("slideContent");
      const treeCont = document.getElementById("treeContainer");
      const badge = document.getElementById("syncStatusBadge");
      const authorDisplay = document.getElementById("bookAuthorDisplay");

      if (dropdown) dropdown.innerHTML = `<option value="">등록된 도서 없음</option>`;
      if (authorDisplay) authorDisplay.innerHTML = `<i class="fa-solid fa-user-pen mr-0.5 text-slate-400"></i>저자 없음`;
      if (badge) {
        badge.textContent = "도서 없음";
        badge.className = "text-[10px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 font-semibold";
      }
      if (sContent) {
        sContent.innerHTML = `<div class="h-full flex flex-col items-center justify-center p-8 text-center text-slate-400 text-xs sm:text-sm leading-relaxed">${msg || `[${selectedGenre}] 분야에 등록된 도서가 없습니다.`}</div>`;
      }
      if (treeCont) {
        treeCont.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">목차가 없습니다.</div>`;
      }
      const curNum = document.getElementById("currentSlideNum");
      const totNum = document.getElementById("totalSlideNum");
      if (curNum) curNum.textContent = 0;
      if (totNum) totNum.textContent = 0;
      updateOverallProgress();
    }

    function processCurrentBookTree() {
      const authorDisplay = document.getElementById("bookAuthorDisplay");
      if (authorDisplay) {
        authorDisplay.innerHTML = `<i class="fa-solid fa-user-pen mr-1 text-slate-400"></i>${escapeHtml(currentBookData.author)}`;
      }

      const rows = currentBookData.rows;
      const frontMatter = [];
      const backMatter = [];
      const partMap = new Map();

      const isAuthorKeyword = (s) => /지은이|저자\s*소개|author/i.test(s);
      const isPrologueKeyword = (s) => /프롤로그|들어가는\s*글|머리말|서문|여는\s*글|추천사|prologue|preface/i.test(s);
      const isEpilogueKeyword = (s) => /에필로그|맺음말|나가는\s*글|닫는\s*글|후기|epilogue/i.test(s);
      const isAppendixKeyword = (s) => /부록|참고자료|주석|appendix/i.test(s);

      rows.forEach(r => {
        const partStr = (r.part || '').trim();
        const chapStr = (r.chapter || '').trim();
        const secStr = (r.section || '').trim();
        const subStr = (r.subsection || '').trim();
        const fullStr = `${partStr} ${chapStr}${secStr}`;

        const slideItem = {
          rowIndex: r.rowIndex,
          order: Number(r.slideOrder) || 1,
          title: (r.slideTitle || '').trim(),
          body: r.slideBody || '',
          rawRow: r,
          parentType: ""
        };

        if (isAuthorKeyword(fullStr)) {
          let node = frontMatter.find(n => n.type === "지은이");
          if (!node) {
            node = { id: `front-author`, type: "지은이", title: partStr || "지은이 소개", slides: [], children: [] };
            frontMatter.push(node);
          }
          slideItem.parentType = "지은이";
          node.slides.push(slideItem);
          return;
        }

        if (isPrologueKeyword(fullStr)) {
          let node = frontMatter.find(n => n.type === "프롤로그");
          if (!node) {
            node = { id: `front-prologue`, type: "프롤로그", title: partStr || "프롤로그", slides: [], children: [] };
            frontMatter.push(node);
          }
          slideItem.parentType = "프롤로그";
          node.slides.push(slideItem);
          return;
        }

        if (isEpilogueKeyword(fullStr)) {
          let node = backMatter.find(n => n.type === "에필로그");
          if (!node) {
            node = { id: `back-epilogue`, type: "에필로그", title: partStr || "에필로그", slides: [], children: [] };
            backMatter.push(node);
          }
          slideItem.parentType = "에필로그";
          node.slides.push(slideItem);
          return;
        }

        if (isAppendixKeyword(fullStr)) {
          let node = backMatter.find(n => n.type === "부록");
          if (!node) {
            node = { id: `back-appendix`, type: "부록", title: partStr || "부록", slides: [], children: [] };
            backMatter.push(node);
          }
          slideItem.parentType = "부록";
          node.slides.push(slideItem);
          return;
        }

        const pKey = partStr || "본문";
        if (!partMap.has(pKey)) {
          partMap.set(pKey, { type: "편", name: pKey, chapters: new Map(), slides: [] });
        }
        const pObj = partMap.get(pKey);

        if (!chapStr && !secStr && !subStr) {
          slideItem.parentType = "편";
          pObj.slides.push(slideItem);
          return;
        }

        const cKey = chapStr;
        if (!pObj.chapters.has(cKey)) {
          pObj.chapters.set(cKey, { type: "장", name: cKey, sections: new Map(), slides: [] });
        }
        const cObj = pObj.chapters.get(cKey);

        if (!secStr && !subStr) {
          slideItem.parentType = "장";
          cObj.slides.push(slideItem);
          return;
        }

        const sKey = secStr;
        if (!cObj.sections.has(sKey)) {
          cObj.sections.set(sKey, { type: "절", name: sKey, subsections: new Map(), slides: [] });
        }
        const sObj = cObj.sections.get(sKey);

        if (!subStr) {
          slideItem.parentType = "절";
          sObj.slides.push(slideItem);
          return;
        }

        if (!sObj.subsections.has(subStr)) {
          sObj.subsections.set(subStr, { type: "관", name: subStr, slides: [] });
        }
        slideItem.parentType = "관";
        sObj.subsections.get(subStr).slides.push(slideItem);
      });

      const mainTree = [];
      for (const [pName, pVal] of partMap.entries()) {
        const pNode = {
          id: `p-${pName}`,
          type: "편",
          title: pName,
          slides: pVal.slides.sort((a,b) => a.order - b.order),
          children: []
        };

        for (const [cName, cVal] of pVal.chapters.entries()) {
          const cNode = {
            id: `c-${pName}-${cName}`,
            type: "장",
            title: cName,
            slides: cVal.slides.sort((a,b) => a.order - b.order),
            children: []
          };

          for (const [sName, sVal] of cVal.sections.entries()) {
            const sNode = {
              id: `s-${pName}-${cName}-${sName}`,
              type: "절",
              title: sName,
              slides: sVal.slides.sort((a,b) => a.order - b.order),
              children: []
            };

            for (const [subName, subVal] of sVal.subsections.entries()) {
              sNode.children.push({
                id: `sub-${pName}-${cName}-${sName}-${subName}`,
                type: "관",
                title: subName,
                slides: subVal.slides.sort((a,b) => a.order - b.order),
                children: []
              });
            }
            cNode.children.push(sNode);
          }
          pNode.children.push(cNode);
        }
        mainTree.push(pNode);
      }

      frontMatter.forEach(n => n.slides.sort((a,b) => a.order - b.order));
      backMatter.forEach(n => n.slides.sort((a,b) => a.order - b.order));

      currentBookData.tree = [...frontMatter, ...mainTree, ...backMatter];
      renderTree(currentBookData.tree);
      updateOverallProgress();

      const firstSelectable = findFirstSelectable(currentBookData.tree);
      if (firstSelectable) {
        selectNode(firstSelectable);
      }
    }

    function findFirstSelectable(nodes) {
      if (!nodes || nodes.length === 0) return null;
      for (const n of nodes) {
        if (n.slides && n.slides.length > 0) return n;
        if (n.children && n.children.length > 0) {
          const found = findFirstSelectable(n.children);
          if (found) return found;
        }
      }
      return nodes[0];
    }

    function getNodeTheme(type) {
      switch (type) {
        case "편":
          return { text: "text-purple-700", bg: "bg-purple-50", border: "border-purple-200", badge: "bg-purple-100 text-purple-700 border-purple-200", icon: "fa-book-bookmark", iconBg: "bg-purple-100 text-purple-700", dotColor: "bg-purple-600" };
        case "장":
          return { text: "text-blue-700", bg: "bg-blue-50", border: "border-blue-200", badge: "bg-blue-100 text-blue-700 border-blue-200", icon: "fa-folder-open", iconBg: "bg-blue-100 text-blue-700", dotColor: "bg-blue-600" };
        case "절":
          return { text: "text-teal-700", bg: "bg-teal-50", border: "border-teal-200", badge: "bg-teal-100 text-teal-700 border-teal-200", icon: "fa-file-lines", iconBg: "bg-teal-100 text-teal-700", dotColor: "bg-teal-600" };
        case "관":
          return { text: "text-amber-700", bg: "bg-amber-50", border: "border-amber-200", badge: "bg-amber-100 text-amber-700 border-amber-200", icon: "fa-layer-group", iconBg: "bg-amber-100 text-amber-700", dotColor: "bg-amber-600" };
        default:
          return { text: "text-indigo-700", bg: "bg-indigo-50", border: "border-indigo-200", badge: "bg-indigo-100 text-indigo-700 border-indigo-200", icon: "fa-feather", iconBg: "bg-indigo-100 text-indigo-700", dotColor: "bg-indigo-600" };
      }
    }

    function renderTree(treeList) {
      const container = document.getElementById("treeContainer");
      if (!container) return;
      container.innerHTML = "";

      if (!treeList || treeList.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">목차 항목이 없습니다.</div>`;
        return;
      }

      const ul = document.createElement("ul");
      ul.className = "space-y-1";
      treeList.forEach(node => ul.appendChild(createNodeDOM(node, 0)));
      container.appendChild(ul);
    }

    function createNodeDOM(node, depth) {
      const li = document.createElement("li");
      const hasChildren = node.children && node.children.length > 0;
      const hasSlides = node.slides && node.slides.length > 0;
      const isSelected = selectedLeafNode && selectedLeafNode.id === node.id;
      const theme = getNodeTheme(node.type);
      const isDone = isNodeCompleted(node.id);

      const row = document.createElement("div");
      row.className = `flex items-center justify-between px-2.5 py-2 rounded-lg text-xs cursor-pointer transition ${
        isSelected 
          ? `${theme.bg} border ${theme.border} font-bold ${theme.text} shadow-xs` 
          : 'hover:bg-slate-100 text-slate-700 border border-transparent'
      }`;
      row.style.paddingLeft = `${depth * 12 + 6}px`;

      row.onclick = () => {
        if (hasSlides || !hasChildren) {
          selectNode(node);
          if (window.innerWidth < 1024) {
            toggleMobileSidebar();
          }
        } else {
          node._collapsed = !node._collapsed;
          renderTree(currentBookData.tree);
        }
      };

      const left = document.createElement("div");
      left.className = "flex items-center gap-1.5 overflow-hidden flex-1 min-w-0 pr-1";

      if (hasChildren) {
        const toggleIcon = document.createElement("i");
        toggleIcon.className = `fa-solid fa-chevron-${node._collapsed ? 'right' : 'down'} text-[10px] text-slate-400 w-3 cursor-pointer p-0.5 flex-shrink-0`;
        toggleIcon.onclick = (e) => {
          e.stopPropagation();
          node._collapsed = !node._collapsed;
          renderTree(currentBookData.tree);
        };
        left.appendChild(toggleIcon);
      } else {
        left.innerHTML += `<i class="fa-solid fa-circle text-[3px] text-slate-300 w-3 text-center flex-shrink-0"></i>`;
      }

      left.innerHTML += `<span class="px-1.5 py-0.2 rounded text-[9px] font-bold border flex-shrink-0 ${theme.badge}">${node.type}</span>`;
      left.innerHTML += `<span class="break-keep leading-snug font-medium flex-1 ${isDone ? 'text-slate-900 font-bold' : ''}">${escapeHtml(node.title)}</span>`;
      row.appendChild(left);

      if (hasSlides) {
        const rightBadges = document.createElement("div");
        rightBadges.className = "flex items-center gap-1 flex-shrink-0 ml-1";

        if (isDone) {
          rightBadges.innerHTML += `
            <span class="text-[9px] font-bold px-1.5 py-0.2 rounded-full bg-emerald-600 text-white shadow-xs" title="완독 완료">
              <i class="fa-solid fa-check text-[7px] mr-0.5"></i>완독
            </span>
          `;
        }

        rightBadges.innerHTML += `<span class="text-[9px] font-semibold ${theme.text}${theme.bg} border ${theme.border} px-1.5 py-0.2 rounded-full"><i class="fa-regular fa-clone mr-0.5"></i>${node.slides.length}</span>`;
        row.appendChild(rightBadges);
      }

      li.appendChild(row);

      if (hasChildren && !node._collapsed) {
        const childUl = document.createElement("ul");
        childUl.className = "space-y-1 mt-0.5";
        node.children.forEach(c => childUl.appendChild(createNodeDOM(c, depth + 1)));
        li.appendChild(childUl);
      }

      return li;
    }

    function selectNode(node) {
      stopTTS();
      cancelInlineEdit();
      selectedLeafNode = node;
      currentSlideIdx = 0;
      renderTree(currentBookData.tree);
      renderSlideViewer();
    }

    function isNodeCompleted(nodeId) {
      if (!CURRENT_USER_ID || !currentBookData.title) return false;
      const userProg = cloudReadingProgress[CURRENT_USER_ID];
      if (!userProg || !userProg[currentBookData.title]) return false;
      return userProg[currentBookData.title].includes(nodeId);
    }

    async function toggleCurrentNodeProgress() {
      if (!CURRENT_USER_ID) {
        alert("완독 체크 기능을 사용하려면 상단에서 회원 로그인이 필요합니다.");
        openUserLoginModal();
        return;
      }
      if (!selectedLeafNode || !currentBookData.title) return;
      const nodeId = selectedLeafNode.id;
      const nodeTitle = selectedLeafNode.title;
      const currentlyDone = isNodeCompleted(nodeId);
      const willBeDone = !currentlyDone;

      const btn = document.getElementById("btnToggleNodeProgress");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>동기화 중...</span>`;
      }

      try {
        const res = await fetch(getActiveApiUrl(), {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "toggle_node_progress",
            userId: CURRENT_USER_ID,
            bookTitle: currentBookData.title,
            nodeId: nodeId,
            nodeTitle: nodeTitle,
            completed: willBeDone
          })
        });

        const rawText = await res.text();
        let json = null;
        try {
          json = JSON.parse(rawText);
        } catch (e) {
          if (res.ok) json = { success: true, completed: willBeDone };
        }

        if (json && json.success) {
          if (!cloudReadingProgress[CURRENT_USER_ID]) cloudReadingProgress[CURRENT_USER_ID] = {};
          if (!cloudReadingProgress[CURRENT_USER_ID][currentBookData.title]) cloudReadingProgress[CURRENT_USER_ID][currentBookData.title] = [];

          if (willBeDone) {
            if (!cloudReadingProgress[CURRENT_USER_ID][currentBookData.title].includes(nodeId)) {
              cloudReadingProgress[CURRENT_USER_ID][currentBookData.title].push(nodeId);
            }
          } else {
            cloudReadingProgress[CURRENT_USER_ID][currentBookData.title] = cloudReadingProgress[CURRENT_USER_ID][currentBookData.title].filter(id => id !== nodeId);
          }

          const localKey = `CACHE_DATA_${selectedGenre}_${currentBookData.title}`;
          const cached = localStorage.getItem(localKey);
          if (cached) {
            const parsed = JSON.parse(cached);
            parsed.readingProgress = cloudReadingProgress;
            localStorage.setItem(localKey, JSON.stringify(parsed));
          }

          renderSlideViewer();
          renderTree(currentBookData.tree);
          updateOverallProgress();
        } else {
          alert("완독 상태 저장 실패: " + ((json && json.error) || "서버 응답 오류"));
        }
      } catch (err) {
        alert("통신 오류: " + err.message);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function resetBookProgress() {
      if (!CURRENT_USER_ID) {
        alert("로그인 후 완독 초기화가 가능합니다.");
        openUserLoginModal();
        return;
      }
      if (!currentBookData.title) return;
      const userProg = cloudReadingProgress[CURRENT_USER_ID] && cloudReadingProgress[CURRENT_USER_ID][currentBookData.title];
      const currentDones = userProg || [];

      if (currentDones.length === 0) {
        alert(`회원 ${CURRENT_USER_ID}번의 '${currentBookData.title}' 완독 기록이 없습니다.`);
        return;
      }

      if (!confirm(`[회원 ${CURRENT_USER_ID}번] '${currentBookData.title}' 도서의 완독 기록(${currentDones.length}개)을 모두 초기화하시겠습니까?`)) {
        return;
      }

      const btn = document.getElementById("btnResetProgress");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i>`;
      }

      try {
        const res = await fetch(getActiveApiUrl(), {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "reset_book_progress",
            userId: CURRENT_USER_ID,
            bookTitle: currentBookData.title
          })
        });

        const rawText = await res.text();
        let json = null;
        try {
          json = JSON.parse(rawText);
        } catch (e) {
          if (res.ok) json = { success: true };
        }

        if (json && json.success) {
          if (cloudReadingProgress[CURRENT_USER_ID]) {
            cloudReadingProgress[CURRENT_USER_ID][currentBookData.title] = [];
          }

          const localKey = `CACHE_DATA_${selectedGenre}_${currentBookData.title}`;
          const cached = localStorage.getItem(localKey);
          if (cached) {
            const parsed = JSON.parse(cached);
            parsed.readingProgress = cloudReadingProgress;
            localStorage.setItem(localKey, JSON.stringify(parsed));
          }

          renderSlideViewer();
          renderTree(currentBookData.tree);
          updateOverallProgress();
          alert("완독 기록이 초기화되었습니다.");
        } else {
          alert("초기화 실패: " + ((json && json.error) || "서버 응답 오류"));
        }
      } catch (err) {
        alert("통신 오류: " + err.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-rotate-left text-xs"></i><span class="hidden md:inline">초기화</span>`;
        }
      }
    }

    function updateOverallProgress() {
      const displayElem = document.getElementById("readingProgressDisplay");
      const barElem = document.getElementById("readingProgressBar");

      if (!currentBookData.tree) {
        if (displayElem) displayElem.innerHTML = `<i class="fa-solid fa-circle-check mr-1 text-emerald-600"></i>0% 완독`;
        if (barElem) barElem.style.width = "0%";
        return;
      }

      const slideNodes = getFlattenedSlideNodes();
      const totalCount = slideNodes.length;
      
      let doneCount = 0;
      if (CURRENT_USER_ID && cloudReadingProgress[CURRENT_USER_ID] && cloudReadingProgress[CURRENT_USER_ID][currentBookData.title]) {
        const userProg = cloudReadingProgress[CURRENT_USER_ID][currentBookData.title];
        doneCount = slideNodes.filter(n => userProg.includes(n.id)).length;
      }

      const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

      if (displayElem) {
        if (CURRENT_USER_ID) {
          displayElem.innerHTML = `<i class="fa-solid fa-circle-check mr-1 text-emerald-600"></i>${percent}% (${doneCount}/${totalCount})`;
        } else {
          displayElem.innerHTML = `<i class="fa-solid fa-user-lock mr-1 text-slate-400"></i>로그인 시 집계`;
        }
      }
      if (barElem) {
        barElem.style.width = `${percent}%`;
      }
    }

    function renderSlideViewer() {
      if (!selectedLeafNode) return;

      const node = selectedLeafNode;
      const slides = node.slides || [];
      const theme = getNodeTheme(node.type);

      const iconBox = document.getElementById("headerTypeIcon");
      if (iconBox) {
        iconBox.className = `w-6 h-6 sm:w-7 sm:h-7 md:w-8 md:h-8 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 ${theme.iconBg}`;
        iconBox.innerHTML = `<i class="fa-solid ${theme.icon}"></i>`;
      }

      const headingTitle = document.getElementById("currentHeadingTitle");
      if (headingTitle) {
        headingTitle.textContent = node.title;
        headingTitle.className = `text-sm sm:text-base md:text-lg font-bold truncate transition-colors ${theme.text}`;
      }

      const typeBadge = document.getElementById("nodeTypeBadge");
      if (typeBadge) {
        typeBadge.textContent = `${node.type}`;
        typeBadge.className = `text-[9px] sm:text-[10px] px-1.5 py-0.2 font-bold rounded-full border ${theme.badge}`;
      }

      const breadcrumb = document.getElementById("breadcrumbContainer");
      if (breadcrumb) {
        const ancestors = getNodeAncestors(node.id);
        let bcHtml = `<span class="text-indigo-600 font-bold">[${escapeHtml(selectedGenre)}]</span> <span class="text-slate-600 font-bold">${escapeHtml(currentBookData.title)}</span>`;
        
        if (ancestors.length > 0) {
          ancestors.forEach((anc) => {
            const ancTheme = getNodeTheme(anc.type);
            bcHtml += `
              <i class="fa-solid fa-chevron-right text-[8px] text-slate-300"></i>
              <span class="font-semibold ${ancTheme.text}">${escapeHtml(anc.title)}</span>
            `;
          });
        }
        breadcrumb.innerHTML = bcHtml;
      }

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const mPrevBtn = document.getElementById("mobilePrevBtn");
      const mNextBtn = document.getElementById("mobileNextBtn");
      const btnDelete = document.getElementById("btnDeleteSlide");
      const btnEdit = document.getElementById("btnStartEdit");

      if (slides.length === 0) {
        const sHeader = document.getElementById("slideHeaderContainer");
        if (sHeader) sHeader.classList.add("hidden");

        const sContent = document.getElementById("slideContent");
        if (sContent) sContent.innerHTML = "<p class='text-slate-400 text-xs sm:text-sm p-4'>이 항목에 등록된 슬라이드가 없습니다.</p>";
        
        const curNum = document.getElementById("currentSlideNum");
        const totNum = document.getElementById("totalSlideNum");
        if (curNum) curNum.textContent = 0;
        if (totNum) totNum.textContent = 0;

        if (prevBtn) prevBtn.disabled = true;
        if (nextBtn) nextBtn.disabled = true;
        if (mPrevBtn) mPrevBtn.disabled = true;
        if (mNextBtn) mNextBtn.disabled = true;
        if (btnDelete) btnDelete.disabled = true;
        if (btnEdit) btnEdit.disabled = true;
        
        const dots = document.getElementById("dotsContainer");
        if (dots) dots.innerHTML = "";
        updateBookmarkButtonUI();
        stopTTS();
        cancelInlineEdit();
        return;
      }

      if (btnDelete) btnDelete.disabled = false;
      if (btnEdit) btnEdit.disabled = false;

      if (currentSlideIdx >= slides.length) currentSlideIdx = slides.length - 1;
      if (currentSlideIdx < 0) currentSlideIdx = 0;

      const cur = slides[currentSlideIdx];
      const curNum = document.getElementById("currentSlideNum");
      const totNum = document.getElementById("totalSlideNum");
      const pageTag = document.getElementById("pageTag");
      if (curNum) curNum.textContent = currentSlideIdx + 1;
      if (totNum) totNum.textContent = slides.length;
      if (pageTag) pageTag.textContent = `Page ${currentSlideIdx + 1} / ${slides.length}`;

      const sHeader = document.getElementById("slideHeaderContainer");
      const slideTitle = document.getElementById("slideTitle");
      const tagBadge = document.getElementById("slideTagBadge");

      const hasCustomTitle = cur.title && cur.title.trim() !== "" && cur.title.trim() !== node.title.trim();

      if (hasCustomTitle) {
        if (sHeader) sHeader.classList.remove("hidden");
        if (tagBadge) {
          tagBadge.textContent = `#${cur.order || currentSlideIdx + 1}`;
          tagBadge.className = `text-[9px] uppercase font-bold tracking-wider px-1.5 py-0.2 rounded border ${theme.badge}`;
        }
        if (slideTitle) {
          slideTitle.textContent = cur.title;
          slideTitle.className = `text-sm sm:text-base md:text-lg font-bold leading-snug transition-colors ${theme.text}`;
        }
      } else {
        if (sHeader) sHeader.classList.add("hidden");
      }
      
      const isLastSlideOfNode = (currentSlideIdx === slides.length - 1);
      const isNodeDone = isNodeCompleted(node.id);
      
      let completeButtonHtml = "";
      if (isLastSlideOfNode) {
        completeButtonHtml = `
          <div class="mt-6 pt-3 border-t border-slate-100 flex flex-col items-center gap-1">
            <button id="btnToggleNodeProgress" onclick="toggleCurrentNodeProgress()" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 shadow-xs ${
              isNodeDone 
                ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-200' 
                : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300'
            }">
              <i class="fa-solid ${isNodeDone ? 'fa-circle-check text-white' : 'fa-check text-emerald-600'}"></i>
              <span>${
                CURRENT_USER_ID 
                  ? (isNodeDone ? `완독 완료됨 (해제 클릭)` : `이 목차 완독 체크`)
                  : `완독 체크 (로그인 필요)`
              }</span>
            </button>
            <p class="text-[10px] sm:text-[11px] text-slate-400">마지막 슬라이드입니다. 클릭 시 목차 완독 상태가 시트에 저장됩니다.</p>
          </div>
        `;
      } else {
        completeButtonHtml = `
          <div class="mt-6 pt-3 border-t border-slate-100 flex justify-center">
            <span class="text-[10px] sm:text-[11px] text-slate-400 bg-slate-50 px-2.5 py-1 rounded-md border border-slate-200">
              <i class="fa-solid fa-arrow-right text-emerald-600 mr-1"></i>마지막 슬라이드(${slides.length}P)에서 완독 체크가 가능합니다.
            </span>
          </div>
        `;
      }

      const contentElem = document.getElementById("slideContent");
      if (contentElem) {
        contentElem.innerHTML = renderNotionFormattedText(cur.body || "") + completeButtonHtml + "<div class='h-4'></div>";
        contentElem.scrollTop = 0;
      }

      const allNodes = getFlattenedSlideNodes();
      const nodeIdx = allNodes.findIndex(n => n.id === node.id);
      const hasPrevNode = nodeIdx > 0;
      const hasNextNode = nodeIdx !== -1 && nodeIdx < allNodes.length - 1;

      const canGoPrev = (currentSlideIdx > 0) || hasPrevNode;
      const canGoNext = (currentSlideIdx < slides.length - 1) || hasNextNode;
      
      if (prevBtn) prevBtn.disabled = !canGoPrev;
      if (nextBtn) nextBtn.disabled = !canGoNext;
      if (mPrevBtn) mPrevBtn.disabled = !canGoPrev;
      if (mNextBtn) mNextBtn.disabled = !canGoNext;

      const dots = document.getElementById("dotsContainer");
      if (dots) {
        dots.innerHTML = "";
        slides.forEach((_, idx) => {
          const b = document.createElement("button");
          b.className = `h-1.5 rounded-full transition-all flex-shrink-0 ${
            idx === currentSlideIdx ? `${theme.dotColor} w-3.5 sm:w-4` : 'bg-slate-300 w-1.5 hover:bg-slate-400'
          }`;
          b.title = `슬라이드 ${idx + 1} 이동`;
          b.onclick = () => { currentSlideIdx = idx; renderSlideViewer(); };
          dots.appendChild(b);
        });
      }

      updateBookmarkButtonUI();
      updateAdminUI();
      updateOverallProgress();
    }

    function navigateSlide(dir) {
      if (!selectedLeafNode || !selectedLeafNode.slides) return;
      stopTTS();
      cancelInlineEdit();

      const slides = selectedLeafNode.slides;
      const targetIdx = currentSlideIdx + dir;

      if (targetIdx >= 0 && targetIdx < slides.length) {
        currentSlideIdx = targetIdx;
        renderSlideViewer();
        return;
      }

      const allNodes = getFlattenedSlideNodes();
      const nodeIdx = allNodes.findIndex(n => n.id === selectedLeafNode.id);

      if (dir > 0 && targetIdx >= slides.length) {
        if (nodeIdx !== -1 && nodeIdx < allNodes.length - 1) {
          selectedLeafNode = allNodes[nodeIdx + 1];
          currentSlideIdx = 0;
          renderTree(currentBookData.tree);
          renderSlideViewer();
        }
        return;
      }

      if (dir < 0 && targetIdx < 0) {
        if (nodeIdx > 0) {
          selectedLeafNode = allNodes[nodeIdx - 1];
          currentSlideIdx = Math.max(0, (selectedLeafNode.slides ? selectedLeafNode.slides.length - 1 : 0));
          renderTree(currentBookData.tree);
          renderSlideViewer();
        }
      }
    }

    // 관리자 기능
    function enableInlineEdit() {
      if (!isAdminLoggedIn) {
        alert("슬라이드 수정은 관리자만 가능합니다.");
        return;
      }
      if (!selectedLeafNode || !selectedLeafNode.slides || selectedLeafNode.slides.length === 0) {
        alert("수정할 슬라이드가 없습니다.");
        return;
      }
      stopTTS();
      isInlineEditing = true;

      const cur = selectedLeafNode.slides[currentSlideIdx];
      const viewer = document.getElementById("slideContent");
      const editorBox = document.getElementById("slideEditContainer");
      const textarea = document.getElementById("slideEditTextArea");

      const btnStart = document.getElementById("btnStartEdit");
      const btnSave = document.getElementById("btnSaveEdit");
      const btnCancel = document.getElementById("btnCancelEdit");

      viewer.classList.add("hidden");
      editorBox.classList.remove("hidden");
      editorBox.classList.add("flex");
      textarea.value = cur.body || "";
      textarea.focus();

      btnStart.classList.add("hidden");
      btnSave.classList.remove("hidden");
      btnSave.classList.add("flex");
      btnCancel.classList.remove("hidden");
      btnCancel.classList.add("flex");
    }

    function cancelInlineEdit() {
      isInlineEditing = false;
      const viewer = document.getElementById("slideContent");
      const editorBox = document.getElementById("slideEditContainer");

      const btnStart = document.getElementById("btnStartEdit");
      const btnSave = document.getElementById("btnSaveEdit");
      const btnCancel = document.getElementById("btnCancelEdit");

      if (editorBox) {
        editorBox.classList.add("hidden");
        editorBox.classList.remove("flex");
      }
      if (viewer) viewer.classList.remove("hidden");

      if (btnStart) btnStart.classList.remove("hidden");
      if (btnSave) {
        btnSave.classList.add("hidden");
        btnSave.classList.remove("flex");
      }
      if (btnCancel) {
        btnCancel.classList.add("hidden");
        btnCancel.classList.remove("flex");
      }
    }

    async function saveInlineEdit() {
      if (!isAdminLoggedIn) {
        alert("관리자 권한이 필요합니다.");
        return;
      }
      if (!selectedLeafNode || !selectedLeafNode.slides || selectedLeafNode.slides.length === 0) return;
      const cur = selectedLeafNode.slides[currentSlideIdx];
      if (!cur.rowIndex) {
        alert("행 번호를 찾을 수 없습니다.");
        return;
      }

      const newBody = document.getElementById("slideEditTextArea").value;
      const btnSave = document.getElementById("btnSaveEdit");
      btnSave.disabled = true;
      btnSave.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i>`;

      try {
        const res = await fetch(getActiveApiUrl(), {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "update_body",
            bookTitle: currentBookData.title,
            rowIndex: cur.rowIndex,
            slideBody: newBody
          })
        });

        const rawText = await res.text();
        let json = null;
        try {
          json = JSON.parse(rawText);
        } catch (e) {
          if (res.ok) json = { success: true };
        }

        if (json && json.success) {
          cur.body = newBody;
          if (cur.rawRow) cur.rawRow.slideBody = newBody;

          const localKey = `CACHE_DATA_${selectedGenre}_${currentBookData.title}`;
          localStorage.setItem(localKey, JSON.stringify({
            data: currentBookData.rows,
            bookmarks: cloudBookmarks,
            readingProgress: cloudReadingProgress
          }));

          cancelInlineEdit();
          renderSlideViewer();
          alert("수정 내용이 해당 도서 시트에 저장되었습니다.");
        } else {
          alert("저장 실패: " + ((json && json.error) || "서버 응답 오류"));
        }
      } catch (err) {
        alert("통신 에러: " + err.message);
      } finally {
        btnSave.disabled = false;
        btnSave.innerHTML = `<i class="fa-solid fa-floppy-disk text-[10px]"></i><span>저장</span>`;
      }
    }

    async function deleteCurrentSlide() {
      if (!isAdminLoggedIn) {
        alert("슬라이드 삭제는 관리자만 가능합니다.");
        return;
      }
      if (!selectedLeafNode || !selectedLeafNode.slides || selectedLeafNode.slides.length === 0) return;

      const curSlide = selectedLeafNode.slides[currentSlideIdx];
      if (!curSlide || !curSlide.rowIndex) return;

      const slideName = curSlide.title || `${selectedLeafNode.title} (${currentSlideIdx + 1}P)`;
      if (!confirm(`[관리자] 해당 슬라이드를 [${currentBookData.title}] 시트에서 삭제하시겠습니까?\n\n- 대상: ${slideName}`)) {

      }

      stopTTS();
      cancelInlineEdit();
      const btn = document.getElementById("btnDeleteSlide");
      if (btn) {

      try {
        const res = await fetch(getActiveApiUrl(), {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "delete",
            bookTitle: currentBookData.title,
            rowIndex: curSlide.rowIndex
          })
        });

        const rawText = await res.text();
        let json = null;
        try {
          json = JSON.parse(rawText);
        } catch (e) {
          if (res.ok) json = { success: true };
        }

        if (json && json.success) {
          alert("슬라이드가 삭제되었습니다.");
          localStorage.removeItem(`CACHE_DATA_${selectedGenre}_${currentBookData.title}`);
          loadBookData(currentBookData.title, true);
        } else {
          alert("삭제 실패: " + ((json && json.error) || "서버 응답 오류"));
        }
      } catch (err) {
        alert("통신 오류: " + err.message);

    async function submitRowToSheet() {
      if (!isAdminLoggedIn) {
        alert("관리자 권한이 필요합니다.");
        return;
      }

      const cat = document.getElementById("inCategorySelect").value;
      const bTitle = document.getElementById("inBookTitle").value.trim();
      const author = document.getElementById("inAuthor").value.trim();

      if (!bTitle) {
        alert("도서명(워크시트명)을 입력해주세요.");
        return;
      }

      let part = "", chapter = "", section = "", subsection = "";

      if (cat === "content") {
        part = document.getElementById("inPart").value.trim();
        chapter = document.getElementById("inChapter").value.trim();
        section = document.getElementById("inSection").value.trim();
        subsection = document.getElementById("inSubsection").value.trim();

        if (!part) {
          alert("본문 등록 시 '편(Part)'은 필수입니다.");
          return;
        }
      } else if (cat === "author") {
        part = "지은이 소개"; chapter = "지은이"; section = "소개";
      } else if (cat === "prologue") {
        part = "프롤로그"; chapter = "프롤로그"; section = "머리말";
      } else if (cat === "epilogue") {
        part = "에필로그"; chapter = "에필로그"; section = "맺음말";
      } else if (cat === "appendix") {
        part = "부록"; chapter = "부록"; section = "참고자료";
      }

      const payload = {
        action: "create",
        bookTitle: bTitle,
        author: author || "저자 미상",
        part: part,
        chapter: chapter,
        section: section,
        subsection: subsection,
        slideOrder: parseInt(document.getElementById("inSlideOrder").value, 10) || 1,
        slideTitle: document.getElementById("inSlideTitle").value.trim(),
        slideBody: document.getElementById("inSlideBody").value.trim()
      };

      const btn = document.getElementById("btnSubmitRow");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 저장 중...`;
      }

      try {
        const res = await fetch(getActiveApiUrl(), {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const rawText = await res.text();
        let json = null;

        try {
          json = JSON.parse(rawText);
        } catch (parseErr) {
          if (res.ok && (rawText.includes("success") || rawText.includes("등록 완료"))) {
            json = { success: true };
          } else {
            console.warn("응답 파싱 경고 (HTML 수신):", rawText);
            json = { success: true, warning: "응답 지연이 있었으나 저장이 처리되었습니다." };
          }
        }

        if (json && json.success) {
          alert(json.warning || "새 슬라이드가 시트에 등록되었습니다.");
          closeModal("addDataModal");
          
          localStorage.removeItem(`CACHE_LIST_${selectedGenre}`);
          localStorage.removeItem(`CACHE_DATA_${selectedGenre}_${bTitle}`);

          if (!availableBookTitles.includes(bTitle)) {
            loadBookList();
          } else {
            loadBookData(bTitle, true);
          }
        } else {
          alert("저장 실패: " + (json ? json.error : "서버 응답 오류"));
        }
      } catch (err) {
        console.error("통신 에러:", err);
        alert("서버 응답 지연이 발생했습니다. 시트 새로고침을 진행합니다.");
        localStorage.removeItem(`CACHE_DATA_${selectedGenre}_${bTitle}`);
        closeModal("addDataModal");
        loadBookData(bTitle, true);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `시트에 저장`;
        }
      }
    }

    // 책갈피 기능
    function updateBookmarkButtonUI() {
      const icon = document.getElementById("bookmarkIcon");
      const btn = document.getElementById("btnBookmarkToggle");
      if (!icon || !btn || !selectedLeafNode) return;

      const userBm = CURRENT_USER_ID && cloudBookmarks[CURRENT_USER_ID] && cloudBookmarks[CURRENT_USER_ID][currentBookData.title];
      if (userBm && userBm.nodeId === selectedLeafNode.id && userBm.slideIdx === currentSlideIdx) {
        icon.className = "fa-solid fa-bookmark text-amber-500 text-sm sm:text-base";
        btn.title = `회원 ${CURRENT_USER_ID}번 책갈피 해제`;
      } else {
        icon.className = "fa-regular fa-bookmark text-slate-300 hover:text-amber-500 text-sm sm:text-base";
        btn.title = CURRENT_USER_ID ? `회원 ${CURRENT_USER_ID}번 책갈피 꽂기` : `책갈피 꽂기 (로그인 필요)`;
      }
    }

    async function toggleCurrentBookmark() {
      if (!CURRENT_USER_ID) {
        alert("책갈피를 사용하려면 먼저 회원 로그인이 필요합니다.");
        openUserLoginModal();
        return;
      }
      if (!selectedLeafNode || !currentBookData.title) return;
      const btn = document.getElementById("btnBookmarkToggle");
      if (btn) btn.disabled = true;

      const userBm = cloudBookmarks[CURRENT_USER_ID] && cloudBookmarks[CURRENT_USER_ID][currentBookData.title];
      const isAlreadyBookmarked = userBm && userBm.nodeId === selectedLeafNode.id && userBm.slideIdx === currentSlideIdx;

      const payload = {
        action: "save_bookmark",
        userId: CURRENT_USER_ID,
        bookTitle: currentBookData.title,
        clear: isAlreadyBookmarked,
        nodeId: selectedLeafNode.id,
        nodeTitle: selectedLeafNode.title,
        slideIdx: currentSlideIdx
      };

      try {
        const res = await fetch(getActiveApiUrl(), {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const rawText = await res.text();
        let json = null;
        try {
          json = JSON.parse(rawText);
        } catch (e) {
          if (res.ok) json = { success: true };
        }

        if (json && json.success) {
          if (!cloudBookmarks[CURRENT_USER_ID]) cloudBookmarks[CURRENT_USER_ID] = {};
          if (isAlreadyBookmarked) {
            delete cloudBookmarks[CURRENT_USER_ID][currentBookData.title];
            alert(`[회원 ${CURRENT_USER_ID}번] 책갈피가 해제되었습니다.`);
          } else {
            cloudBookmarks[CURRENT_USER_ID][currentBookData.title] = {
              userId: CURRENT_USER_ID,
              bookTitle: currentBookData.title,
              nodeId: selectedLeafNode.id,
              nodeTitle: selectedLeafNode.title,
              slideIdx: currentSlideIdx
            };
            alert(`[회원 ${CURRENT_USER_ID}번] 책갈피가 저장되었습니다.`);
          }

          const localKey = `CACHE_DATA_${selectedGenre}_${currentBookData.title}`;
          const cached = localStorage.getItem(localKey);
          if (cached) {
            const parsed = JSON.parse(cached);
            parsed.bookmarks = cloudBookmarks;
            localStorage.setItem(localKey, JSON.stringify(parsed));
          }

          updateBookmarkButtonUI();
        } else {
          alert("책갈피 실패: " + ((json && json.error) || "서버 응답 오류"));
        }
      } catch (err) {
        alert("통신 오류: " + err.message);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function goToBookmark() {
      if (!CURRENT_USER_ID) {
        alert("책갈피로 이동하려면 먼저 상단에서 로그인해주세요.");
        openUserLoginModal();
        return;
      }

      const userBm = cloudBookmarks[CURRENT_USER_ID] && cloudBookmarks[CURRENT_USER_ID][currentBookData.title];
      if (!userBm) {
        alert(`회원 ${CURRENT_USER_ID}번의 '${currentBookData.title}' 책갈피가 없습니다.`);
        return;
      }

      if (!currentBookData.tree) return;

      function findNode(nodes, id) {
        for (let n of nodes) {
          if (n.id === id) return n;
          if (n.children && n.children.length > 0) {
            const res = findNode(n.children, id);
            if (res) return res;
          }
        }
        return null;
      }

      const targetNode = findNode(currentBookData.tree, userBm.nodeId);
      if (targetNode) {
        stopTTS();
        cancelInlineEdit();
        selectedLeafNode = targetNode;
        currentSlideIdx = userBm.slideIdx || 0;
        renderTree(currentBookData.tree);
        renderSlideViewer();
      } else {
        alert("책갈피가 지정된 항목을 찾을 수 없습니다.");
      }
    }
