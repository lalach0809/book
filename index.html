    // TTS 음성 변환 로직
    function convertNumberToSinoKorean(numStr) {
      const num = parseInt(numStr, 10);
      if (isNaN(num)) return numStr;
      if (num === 0) return "영";

      const digits = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
      const smallUnits = ["", "십", "백", "천"];
      const bigUnits = ["", "만", "억", "조"];

      let result = "";
      let s = String(num);
      let len = s.length;
      let chunkCount = Math.ceil(len / 4);

      for (let i = 0; i < chunkCount; i++) {
        let chunkEnd = len - i * 4;
        let chunkStart = Math.max(0, chunkEnd - 4);
        let chunk = s.substring(chunkStart, chunkEnd);
        let chunkStr = "";
        let chunkLen = chunk.length;

        for (let j = 0; j < chunkLen; j++) {
          let d = parseInt(chunk[j], 10);
          let unitPos = chunkLen - j - 1;
          if (d !== 0) {
            if (d === 1 && unitPos > 0) {
              chunkStr += smallUnits[unitPos];
            } else {
              chunkStr += digits[d] + smallUnits[unitPos];
            }
          }
        }

        if (chunkStr !== "") {
          result = chunkStr + bigUnits[i] + " " + result;
        }
      }

      return result.trim();
    }

    function cleanTextForSpeech(raw) {
      if (!raw) return "";
      let t = raw;

      t = t.replace(/```[\s\S]*?```/g, " ");
      t = t.replace(/\([^)]*\)/g, " ");
      t = t.replace(/\[[^\]]*\]/g, " ");
      t = t.replace(/（[^）]*）/g, " ");
      t = t.replace(/%/g, " 퍼센트 ");
      t = t.replace(/[\/\\—–―~|&_]/g, " ");
      t = t.replace(/[-]/g, " ");
      t = t.replace(/^#+\s+/gm, "");
      t = t.replace(/\*\*(.*?)\*\*/g, "$1");
      t = t.replace(/\*(.*?)\*/g, "$1");
      t = t.replace(/~~(.*?)~~/g, "$1");
      t = t.replace(/==(.*?)==/g, "$1");
      t = t.replace(/`([^`]+)`/g, "$1");
      t = t.replace(/^[•*]\s+/gm, "");
      t = t.replace(/\$\\rightarrow\$/g, "에서");
      t = t.replace(/\\rightarrow/g, "에서");
      t = t.replace(/[→➔➜]/g, "에서");
      t = t.replace(/^>\s+/gm, "");
      t = t.replace(/^[💡📌⚠️ℹ️🚨📝✅🔍🎯📖🌱🕊️]\s*/gm, "");
      t = t.replace(/(\d+),(\d+)/g, "$1$2");
      t = t.replace(/\d+/g, (match) => convertNumberToSinoKorean(match));
      t = t.replace(/\s+/g, " ");
      return t.trim();
    }

    function toggleTTS() {
      if (!('speechSynthesis' in window)) {
        alert("브라우저가 TTS 기능을 지원하지 않습니다.");
        return;
      }

      const synth = window.speechSynthesis;

      if (isTTSPaused) {
        synth.resume();
        isTTSPaused = false;
        isTTSPlaying = true;
        updateTTSButtonUI(true);
        return;
      }

      if (isTTSPlaying) {
        synth.pause();
        isTTSPaused = true;
        isTTSPlaying = false;
        updateTTSButtonUI(false, true);
        return;
      }

      if (!selectedLeafNode || !selectedLeafNode.slides || selectedLeafNode.slides.length === 0) {
        alert("읽을 슬라이드 내용이 없습니다.");
        return;
      }

      const cur = selectedLeafNode.slides[currentSlideIdx];
      const titleToRead = cleanTextForSpeech(cur.title || selectedLeafNode.title || "");
      const bodyToRead = cleanTextForSpeech(cur.body || "");
      const fullText = `${titleToRead}.${bodyToRead}`;

      if (!fullText.trim()) {
        alert("슬라이드에 읽을 텍스트가 없습니다.");
        return;
      }

      synth.cancel();

      ttsUtterance = new SpeechSynthesisUtterance(fullText);
      ttsUtterance.lang = "ko-KR";
      ttsUtterance.rate = 1.0;
      ttsUtterance.pitch = 1.0;

      ttsUtterance.onstart = () => {
        isTTSPlaying = true;
        isTTSPaused = false;
        updateTTSButtonUI(true);
      };

      ttsUtterance.onend = () => {
        isTTSPlaying = false;
        isTTSPaused = false;
        updateTTSButtonUI(false);
      };

      ttsUtterance.onerror = (e) => {
        console.error("TTS 에러:", e);
        isTTSPlaying = false;
        isTTSPaused = false;
        updateTTSButtonUI(false);
      };

      synth.speak(ttsUtterance);
    }

    function stopTTS() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isTTSPlaying = false;
      isTTSPaused = false;
      updateTTSButtonUI(false);
    }

    // 마크다운 파서
    function renderNotionFormattedText(raw) {
      if (!raw) return "<p class='text-slate-400 italic text-xs'>내용이 없습니다.</p>";

      const lines = raw.split('\n');
      let html = "";
      let inCodeBlock = false;
      let codeBuffer = "";

      const bulletStyles = [
        { icon: '<i class="fa-solid fa-circle text-[5px] text-emerald-600"></i>', color: "text-slate-900 font-medium" },
        { icon: '<i class="fa-regular fa-circle text-[5px] text-teal-600"></i>', color: "text-slate-800" },
        { icon: '<i class="fa-solid fa-square text-[4px] text-indigo-500"></i>', color: "text-slate-700" },
        { icon: '<i class="fa-solid fa-minus text-[6px] text-slate-400"></i>', color: "text-slate-600" }
      ];

      lines.forEach(line => {
        if (line.trim().startsWith("```")) {
          if (!inCodeBlock) {
            inCodeBlock = true;
            codeBuffer = "";
          } else {
            inCodeBlock = false;
            html += `<pre class="notion-code"><code>${escapeHtml(codeBuffer)}</code></pre>`;
          }
          return;
        }

        if (inCodeBlock) {
          codeBuffer += line + "\n";
          return;
        }

        if (!line.trim()) {
          html += "<div class='h-1.5'></div>";
          return;
        }

        const leadingWhitespaceMatch = line.match(/^[\t ]*/)[0];
        let indentLevel = 0;
        for (let ch of leadingWhitespaceMatch) {
          if (ch === '\t') indentLevel += 1;
          else if (ch === ' ') indentLevel += 0.5;
        }
        indentLevel = Math.min(Math.floor(indentLevel), 4);
        const indentPaddingPx = indentLevel * (window.innerWidth < 768 ? 10 : 16);

        const trimmed = line.trim();

        if (/^(\-\-\-|\*\*\*|___)$/.test(trimmed)) {
          html += `<hr class="notion-hr" />`;
          return;
        }

        if (trimmed.startsWith("### ")) {
          html += `<h4 class="notion-h3" style="margin-left: ${indentPaddingPx}px">${parseInline(trimmed.substring(4).trim())}</h4>`;
          return;
        }
        if (trimmed.startsWith("## ")) {
          html += `<h3 class="notion-h2" style="margin-left: ${indentPaddingPx}px">${parseInline(trimmed.substring(3).trim())}</h3>`;
          return;
        }
        if (trimmed.startsWith("# ")) {
          html += `<h2 class="notion-h1" style="margin-left: ${indentPaddingPx}px">${parseInline(trimmed.substring(2).trim())}</h2>`;
          return;
        }

        const calloutMatch = trimmed.match(/^([💡📌⚠️ℹ️🚨📝✅🔍🎯📖🌱🕊️])\s*(.*)/);
        if (calloutMatch) {
          html += `<div class="notion-callout flex items-start gap-2" style="margin-left: ${indentPaddingPx}px">
            <span class="text-base flex-shrink-0">${calloutMatch[1]}</span>
            <div class="flex-1 font-normal text-slate-800">${parseInline(calloutMatch[2])}</div>
          </div>`;
          return;
        }

        if (trimmed.startsWith(">")) {
          html += `<blockquote class="notion-quote" style="margin-left: ${indentPaddingPx}px">${parseInline(trimmed.substring(1).trim())}</blockquote>`;
          return;
        }

        if (trimmed.startsWith("[ ] ") || trimmed.startsWith("[x] ")) {
          const isChecked = trimmed.startsWith("[x] ");
          const text = trimmed.substring(4);
          html += `<div class="flex items-center gap-1.5 my-0.5 pl-0.5" style="margin-left: ${indentPaddingPx}px">
            <input type="checkbox" ${isChecked ? 'checked' : ''} disabled class="w-3 h-3 rounded text-emerald-600">
            <span class="${isChecked ? 'line-through text-slate-400' : 'text-slate-800'}">${parseInline(text)}</span>
          </div>`;
          return;
        }

        if (trimmed.startsWith("•") || trimmed.startsWith("- ") || trimmed.startsWith("* ")) {
          const content = trimmed.replace(/^[•\-\*]\s*/, "");
          const style = bulletStyles[Math.min(indentLevel, bulletStyles.length - 1)];

          html += `<div class="flex items-start gap-1.5 my-0.5" style="margin-left: ${indentPaddingPx}px">
            <span class="flex items-center justify-center w-2.5 h-4 flex-shrink-0 mt-0.5">
              ${style.icon}
            </span>
            <p class="flex-1 leading-relaxed ${style.color}">${parseInline(content)}</p>
          </div>`;
          return;
        }

        const numMatch = trimmed.match(/^(\d+)\.\s+(.*)/);
        if (numMatch) {
          const numBadgeColor = indentLevel === 0 ? "bg-slate-100 text-slate-800 font-bold" : "bg-slate-50 text-slate-600 text-[10px]";
          html += `<div class="flex items-start gap-1.5 my-0.5" style="margin-left: ${indentPaddingPx}px">
            <span class="flex-shrink-0 ${numBadgeColor} px-1 py-0.2 rounded border border-slate-200 mt-0.5 text-[10px]">${numMatch[1]}</span>
            <p class="flex-1 leading-relaxed text-slate-800">${parseInline(numMatch[2])}</p>
          </div>`;
          return;
        }

        html += `<p class="leading-relaxed mb-1 font-normal text-slate-800" style="margin-left: ${indentPaddingPx}px">${parseInline(trimmed)}</p>`;
      });

      return html;
    }

    function parseInline(text) {
      let t = escapeHtml(text);
      t = t.replace(/\$\\rightarrow\$/g, '-&gt;');
      t = t.replace(/\\rightarrow/g, '-&gt;');
      t = t.replace(/[→➔➜]/g, '-&gt;');
      t = t.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>');
      t = t.replace(/\*(.*?)\*/g, '<em class="italic">$1</em>');
      t = t.replace(/~~(.*?)~~/g, '<del class="line-through text-slate-400">$1</del>');
      t = t.replace(/==(.*?)==/g, '<mark class="notion-highlight">$1</mark>');
      t = t.replace(/`([^`]+)`/g, '<code class="notion-inline-code">$1</code>');
      return t;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function getFlattenedSlideNodes() {
      if (!currentBookData.tree) return [];
      const list = [];
      function traverse(nodes) {
        for (let n of nodes) {
          if (n.slides && n.slides.length > 0) list.push(n);
          if (n.children && n.children.length > 0) traverse(n.children);
        }
      }
      traverse(currentBookData.tree);
      return list;
    }

    function getNodeAncestors(targetId) {
      if (!currentBookData.tree) return [];
      function search(nodes, path) {
        for (let n of nodes) {
          if (n.id === targetId) return path;
          if (n.children && n.children.length > 0) {
            const found = search(n.children, [...path, n]);
            if (found) return found;
          }
        }
        return null;
      }
      return search(currentBookData.tree, []) || [];
    }

    function filterTreeSearch(query) {
      const q = query.trim().toLowerCase();
      if (!currentBookData.tree) return;

      if (!q) {
        renderTree(currentBookData.tree);
        return;
      }

      function filterNode(node) {
        const titleMatch = node.title.toLowerCase().includes(q);
        const slideMatch = node.slides && node.slides.some(s => 
          (s.title && s.title.toLowerCase().includes(q)) || 
          (s.body && s.body.toLowerCase().includes(q))
        );

        let filteredChildren = [];
        if (node.children) {
          filteredChildren = node.children.map(filterNode).filter(Boolean);
        }

        if (titleMatch || slideMatch || filteredChildren.length > 0) {
          return { ...node, _collapsed: false, children: filteredChildren };
        }
        return null;
      }

      const filtered = currentBookData.tree.map(filterNode).filter(Boolean);
      renderTree(filtered);
    }

    function toggleAllNodes(collapse) {
      if (!currentBookData.tree) return;
      function setCol(nodes) {
        nodes.forEach(n => {
          n._collapsed = collapse;
          if (n.children) setCol(n.children);
        });
      }
      setCol(currentBookData.tree);
      renderTree(currentBookData.tree);
    }

    function setupSwipeGesture() {
      const touchArea = document.getElementById("slideTouchArea");
      if (!touchArea) return;
      let touchStartX = 0;
      let touchStartY = 0;

      touchArea.addEventListener('touchstart', (e) => {
        if (isInlineEditing) return;
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      touchArea.addEventListener('touchend', (e) => {
        if (isInlineEditing) return;
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY) * 1.5 && Math.abs(diffX) > 40) {
          if (diffX > 0) navigateSlide(-1);
          else navigateSlide(1);
        }
      }, { passive: true });
    }

      if (e.key === "ArrowRight") navigateSlide(1);

    window.addEventListener("DOMContentLoaded", () => {
      initGenreDropdown();
      updateUserLoginUI();
      setupSwipeGesture();
      updateAdminUI();
    });
  </script>
</body>
